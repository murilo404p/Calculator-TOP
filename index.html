<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body class="bg-amber-400 flex justify-center items-center h-screen flex-col">
    <section class="bg-[#212121] flex w-100 h-150 rounded-4xl items-center flex-col">
      <div class="bg-gray-600 w-90 h-25 justify-start mt-8 rounded-2xl shadow-2xl">
        <p id="display" class="text-[#B2BEB5] text-2xl w-full text-end px-4">0</p>
        <p id="resultado" class="text-white text-5xl w-full text-end px-4" >0</p>
      </div>
      <div class=" grid grid-cols-4 gap-4 w-90 mt-8">
        <button id="allClear" class="btn clear-btn">AC</button>
        <button id="clear" class="btn clear-btn">C</button>
        <button id="remaider" class="btn operators-btn">%</button>
        <button id="divide" class="btn operators-btn">÷</button>
        <button id="digit-7" class="btn number-btn">7</button>
        <button id="digit-8" class="btn number-btn">8</button>
        <button id="digit-9" class="btn number-btn">9</button>
        <button id="mutiply" class="btn operators-btn">x</button>
        <button id="digit-4" class="btn number-btn">4</button>
        <button id="digit-5" class="btn number-btn">5</button>
        <button id="digit-6" class="btn number-btn">6</button>
        <button id="minus" class="btn operators-btn">-</button>
        <button id="digit-1" class="btn number-btn">1</button>
        <button id="digit-2" class="btn number-btn">2</button>
        <button id="digit-3" class="btn number-btn">3</button>
        <button id="plus" class="btn operators-btn">+</button>
        <button id="digit-0" class="btn number-btn">0</button>
        <button id="digit-point" class="btn number-btn">.</button>
        <button id="equals" class="btn equals-btn col-span-2 transition-colors">=</button>
      </div>
    </section>
    <footer >murilo404p © 2026</footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
